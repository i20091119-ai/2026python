name: GitHub Pages 배포

# dist/workbook.html 은 자원이 모두 들어 있는 단일 파일이라
# 그대로 index.html 로 올리면 경로 문제 없이 동작한다.

on:
  push:
    branches: [claude/friendly-thompson-3qhqry]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: 사이트 폴더 준비
        run: |
          mkdir -p site
          cp dist/workbook.html site/index.html
          cp dist/workbook.html site/workbook.html
          ls -la site

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
